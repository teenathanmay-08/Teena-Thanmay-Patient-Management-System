<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patient Registration | TEENA THANMAY</title><link rel="stylesheet" href="style.css"><script defer src="script.js"></script></head><body><nav class="nav"><a class="brand" href="index.html">TEENA THANMAY<span>PATIENT MANAGEMENT SYSTEM</span></a><div class="navlinks"><a href="index.html">Home</a><a href="registration.html">Register Patient</a><a href="patients.html">Patients</a><a href="about.html">About</a></div></nav><main class="container"><section class="banner"><div><div class="eyebrow">Patient intake</div><h1 id="formTitle">Patient Registration</h1><p class="muted">Patient ID is generated automatically after registration.</p></div><img src="https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=900&q=85" alt="Doctor consulting patient"></section><section class="form-card"><div id="notice" class="notice"></div><form id="patientForm"><div class="grid"><div class="field"><label>Name *</label><input name="name" required maxlength="100"></div><div class="field"><label>Email *</label><input name="email" type="email" required></div><div class="field"><label>Phone Number *</label><input name="phoneno" required maxlength="15"></div><div class="field"><label>Gender *</label><select name="gender" required><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></div><div class="field"><label>Age *</label><input name="age" type="number" min="0" max="130" required></div><div class="field full"><label>Medical Problem *</label><textarea name="problem" required></textarea></div></div><div class="actions"><button class="btn" id="save">Register Patient</button><button class="btn secondary" type="reset">Clear</button></div></form></section></main><footer>Teena Thanmay Patient Management System · Patient Registration</footer></body></html>
